# 宝塔 Linux 面板站点配置示例（Nginx）
#
# 使用方式二选一：
# 1. 未开启 SSL 时：整段替换 网站 → 设置 → 配置文件 中的内容，然后改域名和路径。
# 2. 已开启 SSL 时：只把下面 location 相关片段追加到现有配置里，避免覆盖宝塔生成的 SSL 配置。
#
# 站点根目录按宝塔习惯使用 /www/wwwroot/bcblog

server {
    listen 80;
    server_name your-domain.com;

    index index.html index.htm;
    root /www/wwwroot/bcblog;

    # 后台上传视频最大 200MB
    client_max_body_size 200M;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 前端 SPA：history 模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代到 Spring Boot
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 写文章、GitHub 评论等接口可能较慢
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传文件由 Nginx 直接提供（图片 / 背景 / Logo）
    location ^~ /uploads/ {
        alias /www/wwwroot/bcblog/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /www/wwwlogs/bcblog.log;
    error_log /www/wwwlogs/bcblog.error.log;
}
