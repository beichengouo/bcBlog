# bcBlog Nginx 配置示例
# 放置位置：/etc/nginx/conf.d/bcblog.conf
# 使用前把 your-domain.com、/data/bcblog 改成你自己的实际值

server {
    listen 80;
    server_name your-domain.com;

    # 后台上传视频最大 200MB，这里必须放开，否则会被 Nginx 拦截
    client_max_body_size 200M;

    root /data/bcblog/frontend;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 前端 SPA：history 模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 写文章、GitHub 评论等接口可能较慢，放宽超时
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传的图片 / 背景 / Logo，直接由 Nginx 提供，性能更好
    location ^~ /uploads/ {
        alias /data/bcblog/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 前端静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# HTTPS 建议直接用 certbot 自动生成：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# certbot 会自动在上面这个 server 块基础上加 443 和证书配置。
