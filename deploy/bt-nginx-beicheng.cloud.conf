# bcBlog 宝塔 Linux 面板站点配置（域名 beicheng.cloud）
# 替换位置：网站 → beicheng.cloud → 设置 → 配置文件
#
# 目录约定：
#   仓库源码： /www/wwwroot/beicheng.cloud
#   前端产物： /www/wwwroot/beicheng.cloud/frontend/dist
#   上传目录： /www/wwwroot/beicheng.cloud/uploads
#   后端 jar： /www/wwwroot/beicheng.cloud/bcBlog.jar

server
{
    listen 80;
    listen [::]:80;
    server_name beicheng.cloud www.beicheng.cloud;

    index index.html index.htm;
    root /www/wwwroot/beicheng.cloud/frontend/dist;

    # 后台上传视频最大 200MB，必须设置，否则默认 1M 会失败
    client_max_body_size 200M;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/beicheng.cloud.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/beicheng.cloud/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # 前端 SPA：history 模式回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反代到 Spring Boot
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 写文章、GitHub 评论等接口可能较慢
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 上传文件由 Nginx 直接提供
    location ^~ /uploads/ {
        alias /www/wwwroot/beicheng.cloud/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/beicheng.cloud.log;
    error_log  /www/wwwlogs/beicheng.cloud.error.log;
}
