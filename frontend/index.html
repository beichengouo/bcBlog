<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        let saved
        try { saved = localStorage.getItem('bcblog-theme-preference') } catch (_) {}
        const hour = (new Date().getUTCHours() + 8) % 24
        const mode = saved === 'light' || saved === 'dark' ? saved : (hour >= 7 && hour < 19 ? 'light' : 'dark')
        document.documentElement.dataset.theme = mode
        document.documentElement.classList.toggle('dark', mode === 'dark')
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="/iris-loading.css" />
    <title>bcBlog</title>
    <link rel="icon" href="/uploads/logo/avatar.png" />
  </head>
  <body>
    <div id="iris-boot" class="iris-loading iris-boot" role="status" aria-live="polite">
      <div class="iris-boot-card">
        <div class="iris-mascot" aria-hidden="true"><div class="iris-avatar-shell"><span class="iris-avatar-fallback">✦</span><img src="/uploads/logo/avatar.png" alt="" onerror="this.hidden=true" /></div><span class="iris-star one">✧</span><span class="iris-star two">✦</span><span class="iris-star three">♥</span></div>
        <h1>IRIS 正在准备小站</h1><p id="iris-boot-message">正在收集散落的星光～</p>
        <div id="iris-boot-progress" class="iris-progress" role="progressbar" aria-label="正在加载网站资源"></div><p class="iris-caption">让故事与音乐，再靠近一点。</p>
        <button id="iris-boot-continue" class="iris-boot-retry" hidden onclick="window.__irisBoot.ready()">先进入小站</button>
        <button id="iris-boot-retry" class="iris-boot-retry" hidden onclick="window.location.reload()">重新加载</button>
        <noscript><p>请启用 JavaScript 后浏览小站。</p></noscript>
      </div>
    </div>
    <script>
      (() => {
        const shell = document.getElementById('iris-boot')
        const showFailure = () => { document.getElementById('iris-boot-message').textContent = '星光暂时迷路了，请检查网络或重试。'; document.getElementById('iris-boot-retry').hidden = false }
        const timeout = window.setTimeout(showFailure, 20000)
        window.__irisBoot = {
          ready() { clearTimeout(timeout); shell.classList.add('is-ready'); shell.setAttribute('aria-hidden', 'true'); setTimeout(() => shell.remove(), 230) },
          progress({ total, loaded, requestsPending }) {
            const bar = document.getElementById('iris-boot-progress')
            const percent = total ? Math.floor(loaded / total * 100) : 0
            const determinate = total > 0 && requestsPending === 0
            bar.classList.toggle('is-determinate', determinate)
            if (determinate) { bar.style.setProperty('--boot-progress', percent + '%'); bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', '100'); bar.setAttribute('aria-valuenow', String(percent)) }
            else bar.removeAttribute('aria-valuenow')
            document.getElementById('iris-boot-message').textContent = determinate ? `资源加载 ${percent}% · ${loaded} / ${total} 已就绪` : `正在读取首页内容${total ? ' · 已准备 ' + loaded + ' / ' + total + ' 个资源' : '与背景…'}`
          },
          partial() { clearTimeout(timeout); document.getElementById('iris-boot-message').textContent = '部分内容暂未加载完成，可以重试或先进入小站。'; document.getElementById('iris-boot-retry').hidden = false; document.getElementById('iris-boot-continue').hidden = false },
          fail() { clearTimeout(timeout); showFailure() }
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
